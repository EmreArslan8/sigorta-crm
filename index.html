<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SigortaOS — Acente Yönetim Sistemi (Demo)</title>
<meta name="description" content="Sigorta acenteleri için müşteri, poliçe, tahsilat, personel, zimmet, finans ve komisyon yönetimi — demo arayüz.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231b4dd8'/><text x='50' y='68' font-size='56' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>S</text></svg>">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div class="brand-txt"><b>SigortaOS</b><span>Acente Paneli</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot">
      <div class="sb-user">
        <div class="av">EA</div>
        <div><b>Emre Arslan</b><span>Acente Müdürü</span></div>
      </div>
      <div style="margin-top:10px;text-align:center">v0.9.0 · Demo Sürümü</div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="demo-strip">
      <b>DEMO</b>
      <span>Tüm veriler örnektir · Gerçek sigorta şirketi entegrasyonu bağlı değildir</span>
    </div>
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Menü">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div>
        <h1 id="pageTitle">Kontrol Paneli</h1>
        <div class="sub" id="pageSub">Genel durum özeti</div>
      </div>
      <div class="top-actions">
        <div class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="globalSearch" placeholder="Müşteri, poliçe no, plaka ara…" autocomplete="off">
        </div>
        <button class="btn btn-icon hide-sm" id="btnNotif" title="Bildirimler">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
        <button class="btn btn-p" id="btnSync">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
          <span class="hide-xs">Verileri Senkronize Et</span>
        </button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="overlay" id="overlay"><div id="modalHost"></div></div>
<div class="toasts" id="toasts"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/views.js"></script>
<script>window.App.start();</script>
</body>
</html>
